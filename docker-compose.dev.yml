version: "3.9"

services:
  sevahealth-api-dev:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: sevahealth-api-dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./sevahealth.db
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=MOCK
      - DEBUG=true
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis
    networks:
      - sevahealth-dev-network

  redis:
    image: redis:7-alpine
    container_name: sevahealth-redis-dev
    ports:
      - "6379:6379"
    networks:
      - sevahealth-dev-network

networks:
  sevahealth-dev-network:
    driver: bridge
